name: Check LLM key configured
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Check whether ACOS_LLM_API_KEY / ACOS_LLM_BASE_URL are set (prints presence/length only, never the value)
        run: >
          curl -s -H "Authorization: Bearer $RENDER_API_KEY"
          "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars?limit=100"
          | jq -r '
          (map(.envVar // .)) as $vars
          | ($vars | map(select(.key=="ACOS_LLM_API_KEY")) | .[0].value) as $key
          | ($vars | map(select(.key=="ACOS_LLM_BASE_URL")) | .[0].value) as $base
          | ($vars | map(select(.key=="ACOS_LLM_MODEL")) | .[0].value) as $model
          | (if $key == null then "ACOS_LLM_API_KEY: NOT SET"
             elif $key == "" then "ACOS_LLM_API_KEY: SET BUT EMPTY"
             else "ACOS_LLM_API_KEY: SET (length=" + ($key | length | tostring) + " chars)" end),
          (if $base == null then "ACOS_LLM_BASE_URL: NOT SET" else "ACOS_LLM_BASE_URL: " + $base end),
          (if $model == null then "ACOS_LLM_MODEL: NOT SET" else "ACOS_LLM_MODEL: " + $model end)
          '
