name: Check principal bootstrap key configured
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Check whether PRINCIPAL_BOOTSTRAP_KEY is set (prints presence/length only, never the value)
        run: >
          curl -s -H "Authorization: Bearer $RENDER_API_KEY"
          "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars?limit=100"
          | jq -r '(map(.envVar // .) | map(select(.key=="PRINCIPAL_BOOTSTRAP_KEY")) | .[0].value) as $v
          | if $v == null then "PRINCIPAL_BOOTSTRAP_KEY: NOT SET"
          elif $v == "" then "PRINCIPAL_BOOTSTRAP_KEY: SET BUT EMPTY"
          else "PRINCIPAL_BOOTSTRAP_KEY: SET (length=" + ($v | length | tostring) + " chars)"
          end'
