[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "academicos"
version = "0.1.0"
description = "AcademicOS - CBSE/NCERT Academic Brain: evidence-grounded knowledge graph, retrieval and reasoning substrate"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pymupdf==1.28.2",  # the version the Exemplar bank was verified on (ncert_exemplar.VERIFIED_PYMUPDF)
    "requests>=2.31",
    "numpy>=1.26",  # package-level import in assessment/imaging.py (loaded by the API app)
    "spacy>=3.7",   # package-level import in extract/local_ie.py (openie/concept-profile)
]

[project.optional-dependencies]
parse-vlm = ["torch>=2.5", "transformers>=4.44", "Pillow", "einops", "easydict", "addict", "matplotlib"]
ocr = ["pytesseract", "Pillow"]
retrieval = ["numpy>=1.26", "sentence-transformers>=3.0"]
api = ["fastapi>=0.111", "uvicorn>=0.30", "reportlab>=4.0", "python-multipart>=0.0.9"]
mobile-scan = ["opencv-python-headless>=4.9", "numpy>=1.26", "Pillow"]
gcs = ["google-cloud-storage>=2.16"]
# Cloud SQL durability backend (assessment/postgres_kv.py). [binary] bundles
# libpq so the slim runtime image needs no extra system packages; psycopg_pool
# bounds connections, which Cloud Run's concurrency would otherwise blow past.
postgres = ["psycopg[binary]>=3.2", "psycopg_pool>=3.2"]
dev = ["pytest>=8", "httpx>=0.27"]  # httpx is what starlette.testclient needs
# The question-bank MCP server (src/academicos/mcp/qbank_server.py). Was never
# declared: tests/test_qbank_mcp.py passed only on machines that happened to
# have it, and failed all 23 of its tests in CI. The network transports also
# need [api] for uvicorn; stdio does not.
mcp = ["mcp>=2.2,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
academicos = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

